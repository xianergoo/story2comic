<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.novel.Title}} - NovelForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.1/sse.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <a href="/" class="text-sm text-gray-400 hover:text-indigo-600">← 返回书架</a>
      <span class="text-lg font-bold text-indigo-600">{{.novel.Title}}</span>
    </div>
    <a href="/logout" class="text-sm text-gray-400 hover:text-red-500">退出</a>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6">
    <div class="flex items-center gap-3 mb-4">
      <span class="text-sm text-gray-500 max-w-md truncate">{{.novel.Summary}}</span>
      <span class="text-xs px-2 py-0.5 rounded-full {{if eq .novel.Status "completed"}}bg-green-100 text-green-700{{else if eq .novel.Status "failed"}}bg-red-100 text-red-700{{else}}bg-indigo-100 text-indigo-700{{end}}">{{.novel.Status}}</span>
    </div>

    <div class="flex gap-2 mb-4"
         hx-ext="sse"
         sse-connect="/api/sse?novel_id={{.novel.ID}}"
         sse-swap="progress"
         hx-swap="none"></div>

    <div id="chapter-list" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
      {{range .chapters}}
      <a href="/novel/{{$.novel.ID}}/chapter/{{.ChapterNo}}" class="bg-white rounded-lg shadow-sm border p-3 hover:shadow-md transition-shadow">
        <span class="text-xs text-gray-400">第{{.ChapterNo}}章</span>
        <p class="font-medium text-sm truncate">{{.Title}}</p>
        <span class="text-xs {{if eq .Status "done"}}text-green-500{{else}}text-amber-500{{end}}">{{.Status}}</span>
      </a>
      {{end}}
    </div>

    {{if not .chapters}}
    <div class="text-center py-16 text-gray-400">
      <div class="animate-pulse">
        <p class="text-lg mb-2">AI 正在创作中...</p>
        <p id="progress-text" class="text-sm">正在生成故事大纲</p>
      </div>
    </div>
    {{end}}
  </main>

  <script>
    document.addEventListener('htmx:sseMessage', function(e) {
      var data = JSON.parse(e.detail.data);
      var el = document.getElementById('progress-text');
      if (!el) return;
      if (data.type === 'chapter') {
        el.innerHTML = '<span class="text-indigo-600">第' + data.chapter_no + '章已生成（' + data.status + '），正在绘制漫画...</span>';
        setTimeout(function() { location.reload(); }, 2000);
      } else if (data.type === 'comic') {
        el.innerHTML = '<span class="text-green-600">第' + data.chapter_no + '章漫画完成！</span>';
        setTimeout(function() { location.reload(); }, 2000);
      } else if (data.type === 'error') {
        el.innerHTML = '<span class="text-red-600">错误：' + data.msg + '</span>';
      }
      console.log('SSE:', data);
    });
    document.addEventListener('htmx:sseError', function(e) {
      console.error('SSE connection error', e);
    });
  </script>
</body>
</html>
