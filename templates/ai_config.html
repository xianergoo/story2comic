<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI配置 - NovelForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5"></script>
</head>
<body class="bg-gray-50 min-h-screen" x-data="{ editingId: 0 }">
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex items-center justify-between">
    <a href="/" class="text-xl font-bold text-indigo-600">NovelForge</a>
    <div class="flex items-center gap-4">
      <a href="/" class="text-sm text-gray-600 hover:text-indigo-600">书架</a>
      <a href="/ai-config" class="text-sm text-indigo-600 font-medium">AI配置</a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-red-500">退出</a>
    </div>
  </nav>
  <main class="max-w-2xl mx-auto px-4 py-6">
    <h1 class="text-2xl font-bold mb-6">AI 提供商配置</h1>
    {{range .configs}}
    <div class="bg-white border rounded-lg p-4 mb-3">
      <div x-show="editingId !== {{.ID}}">
        <div class="flex items-center justify-between">
          <div>
            <span class="font-semibold">{{.Name}}</span>
            {{if .IsDefault}}<span class="ml-2 bg-green-100 text-green-700 text-xs px-2 py-0.5 rounded-full">默认</span>{{end}}
            <div class="text-sm text-gray-500 mt-1">{{.Provider}} · {{.TextModel}} · {{.ImageModel}}</div>
          </div>
          <div class="flex gap-2">
            <button @click="editingId = {{.ID}}" class="text-indigo-500 text-sm hover:text-indigo-700">编辑</button>
            <button hx-delete="/ai-config/{{.ID}}" hx-target="body" class="text-red-500 text-sm hover:text-red-700">删除</button>
          </div>
        </div>
      </div>
      <div x-show="editingId === {{.ID}}">
        <form hx-put="/ai-config/{{.ID}}" hx-target="body" class="space-y-3">
          <div class="flex gap-3">
            <input name="name" value="{{.Name}}" required class="flex-1 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
            <select name="provider" class="px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
              <option value="openai" {{if eq .Provider "openai"}}selected{{end}}>OpenAI</option>
              <option value="qwen" {{if eq .Provider "qwen"}}selected{{end}}>通义千问</option>
              <option value="custom" {{if eq .Provider "custom"}}selected{{end}}>自定义</option>
            </select>
          </div>
          <input name="api_key" type="password" value="{{.APIKey}}" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
          <input name="base_url" value="{{.BaseURL}}" placeholder="Base URL（可选）" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
          <div class="flex gap-3">
            <input name="text_model" value="{{.TextModel}}" required class="flex-1 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
            <input name="image_model" value="{{.ImageModel}}" required class="flex-1 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
          </div>
          <label class="flex items-center gap-2 text-sm text-gray-600">
            <input type="checkbox" name="is_default" {{if .IsDefault}}checked{{end}} class="rounded"> 设为默认
          </label>
          <div class="flex gap-2">
            <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium">保存修改</button>
            <button type="button" @click="editingId = 0" class="px-4 py-2 border rounded-lg text-gray-500 hover:bg-gray-50">取消</button>
          </div>
        </form>
      </div>
    </div>
    {{end}}

    <div class="bg-white border rounded-lg p-4 mt-6">
      <h2 class="font-semibold mb-3">新增配置</h2>
      <form hx-post="/ai-config" hx-target="body" class="space-y-3">
        <div class="flex gap-3">
          <input name="name" placeholder="配置名称" required class="flex-1 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
          <select name="provider" class="px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="openai">OpenAI</option>
            <option value="qwen">通义千问</option>
            <option value="custom">自定义</option>
          </select>
        </div>
        <input name="api_key" type="password" placeholder="API Key" required class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
        <input name="base_url" placeholder="Base URL（可选，留空使用默认）" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
        <div class="flex gap-3">
          <input name="text_model" placeholder="文字模型" required class="flex-1 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
          <input name="image_model" placeholder="图像模型" required class="flex-1 px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
        </div>
        <label class="flex items-center gap-2 text-sm text-gray-600">
          <input type="checkbox" name="is_default" class="rounded"> 设为默认
        </label>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium">保存</button>
      </form>
    </div>
  </main>
</body>
</html>
