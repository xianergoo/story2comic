<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书架 - NovelForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-white shadow-sm border-b px-6 py-3 flex items-center justify-between">
    <a href="/" class="text-xl font-bold text-indigo-600">NovelForge</a>
    <div class="flex items-center gap-4">
      <a href="/" class="text-sm text-indigo-600 font-medium">书架</a>
      <a href="/ai-config" class="text-sm text-gray-600 hover:text-indigo-600">AI配置</a>
      <a href="/logout" class="text-sm text-gray-400 hover:text-red-500">退出</a>
    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 py-6" x-data="{ showModal: false }">
    {{if .error}}
    <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4 text-sm">{{.error}}</div>
    {{end}}
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold">我的书架</h1>
      <button @click="showModal = true" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700">+ 新建作品</button>
    </div>

    {{if .novels}}
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      {{range .novels}}
      <a href="/novel/{{.ID}}" class="bg-white rounded-lg shadow-sm border hover:shadow-md transition-shadow p-4">
        <div class="text-xs mb-2">
          {{if eq .Mode "inspiration"}}<span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">灵感起步</span>
          {{else if eq .Mode "outline"}}<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded-full">章纲驱动</span>
          {{else}}<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">盲盒创作</span>{{end}}
        </div>
        <h3 class="font-semibold mb-1 truncate">{{.Title}}</h3>
        <p class="text-xs text-gray-400">{{.Status}}</p>
      </a>
      {{end}}
    </div>
    {{else}}
    <div class="text-center py-20 text-gray-400">
      <p class="text-lg mb-2">还没有作品</p>
      <p>点击「新建作品」开始创作你的第一本 AI 小说</p>
    </div>
    {{end}}

    <!-- 新建作品弹窗 -->
    <div x-show="showModal" x-cloak class="fixed inset-0 bg-black/30 flex items-center justify-center z-50" @click.self="showModal = false">
      <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 mx-4">
        <h2 class="text-xl font-bold mb-4">新建作品</h2>
        <form hx-post="/novel" hx-target="body" class="space-y-3">
          <input name="title" placeholder="作品标题（可为空，AI自动生成）" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
          <select name="mode" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="inspiration">灵感起步</option>
            <option value="outline">章纲驱动</option>
            <option value="blindbox">盲盒创作</option>
          </select>
          <select name="image_mode" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400">
            <option value="single">单插画</option>
            <option value="multi">多格漫画</option>
          </select>
          <textarea name="summary" rows="3" placeholder="创作起点：一句话梗概或详细信息（盲盒模式可留空）" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-400 resize-none"></textarea>
          <p class="text-xs text-gray-400">AI配置请在 <a href="/ai-config" class="text-indigo-600 underline">AI配置页面</a> 中设为默认</p>
          <input type="hidden" name="ai_config_id" value="0">
          <div class="flex gap-2 pt-2">
            <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700">开始创作</button>
            <button type="button" @click="showModal = false" class="px-4 py-2 border rounded-lg text-gray-500 hover:bg-gray-50">取消</button>
          </div>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
